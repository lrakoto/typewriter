name: Mac build and storage checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check local note storage
        run: ./scripts/test.sh
      - name: Build signed local app
        run: ./scripts/build.sh
