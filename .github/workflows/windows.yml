name: Windows portable build
on:
  push:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check portable storage
        run: dotnet run --project windows/Typewriter.Checks -c Release
      - name: Exercise native Windows editor and render previews
        run: dotnet run --project windows/Typewriter.WindowsChecks -c Release -- dist/windows-validation
      - name: Publish standalone executable
        run: ./scripts/build-windows.ps1
      - name: Launch the shipped EXE from different folders
        run: ./scripts/test-windows-portable.ps1 -Executable dist/windows/Typewriter-win-x64/Typewriter.exe
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-validation
          path: dist/windows-validation
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Typewriter-Windows-x64
          path: dist/windows/Typewriter-Windows-x64.zip
          compression-level: 0
